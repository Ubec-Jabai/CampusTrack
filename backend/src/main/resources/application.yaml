spring:
  data:
    web:
      pageable:
        serialization-mode: via-dto
        one-indexed-parameters: true
        max-page-size: 50

  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

  application:
    name: campustrack
    security:
      dev-open: true
    cors:
      allowed-origins: http://localhost:3000
    microservices:
      pdf-parser: http://localhost:8001/api/pdf-parser/create/
      incident-photo: http://localhost:8001/api/incident-photo/
      sample: https://jsonplaceholder.typicode.com/

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://localhost:3306/campus_tracker_database
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jwt:
    secret: dev_jwt_token_PjmkwUUavaMfAGhlyzL4JO7OKRRLnKJvdIkPUwdOXMi
    issuer: campus-incident-dev-system
    expiration: 86400000

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
